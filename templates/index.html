<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Purchase Prediction</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f4f6fb;margin:0;padding:24px;color:#1f2937}
  .card{max-width:560px;margin:auto;background:#fff;padding:28px;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
  h1{margin-top:0;font-size:1.4rem}
  label{display:block;margin-top:12px;font-size:.9rem;font-weight:600}
  input,select{width:100%;padding:9px;margin-top:4px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}
  button{margin-top:20px;width:100%;padding:12px;background:#4f46e5;color:#fff;border:0;border-radius:8px;font-size:1rem;cursor:pointer}
  .result{margin-top:20px;padding:14px;border-radius:8px;font-weight:600}
  .yes{background:#dcfce7;color:#166534}.no{background:#fee2e2;color:#991b1b}.err{background:#fef3c7;color:#92400e}
  small{font-weight:400;display:block;margin-top:4px}
</style>
</head>
<body>
<div class="card">
  <h1>Customer Purchase Prediction</h1>
  <form method="post" action="/predict">
    <label>Age <input type="number" name="age" value="{{ values.get('age','') }}" required></label>
    <label>Gender
      <select name="gender">
        <option {{ 'selected' if values.get('gender')=='Male' }}>Male</option>
        <option {{ 'selected' if values.get('gender')=='Female' }}>Female</option>
      </select>
    </label>
    <label>Annual income <input type="number" step="any" name="annual_income" value="{{ values.get('annual_income','') }}" required></label>
    <label>Browsing time (minutes) <input type="number" step="any" name="browsing_time" value="{{ values.get('browsing_time','') }}" required></label>
    <label>Pages visited <input type="number" name="pages_visited" value="{{ values.get('pages_visited','') }}" required></label>
    <label>Previous purchases <input type="number" name="previous_purchases" value="{{ values.get('previous_purchases','') }}" required></label>
    <label>Time spent on website (minutes) <input type="number" step="any" name="time_on_site" value="{{ values.get('time_on_site','') }}" required></label>
    <label>Discount offered (%) <input type="number" step="any" name="discount_offered" value="{{ values.get('discount_offered','') }}" required></label>
    <button type="submit">Predict</button>
  </form>
  {% if error %}<div class="result err">{{ error }}</div>{% endif %}
  {% if result %}
  <div class="result {{ 'yes' if result.purchase else 'no' }}">
    {{ result.label }}
    <small>Purchase probability: {{ result.probability }}% (via {{ result.source }})</small>
  </div>
  {% endif %}
</div>
</body>
</html>
