name: CI - Purchase Prediction

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve code from GitHub
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python train.py --train data --model-dir model

      - name: Run tests
        run: pytest -v

      - name: Package application
        run: |
          mkdir -p dist
          tar -czf dist/purchase-prediction-app.tar.gz app.py train.py templates model requirements.txt

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: purchase-prediction-package
          path: dist/purchase-prediction-app.tar.gz

      - name: Build Docker image
        run: docker build -t purchase-prediction-app:${{ github.sha }} .
